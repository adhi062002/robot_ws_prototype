/**:
  ros__parameters:
    source: "bag"

    # ── YOLO ──────────────────────────────────────────────────────────────────
    # Point this at your fine-tuned dent detector weights.
    # If the file doesn't exist, Ultralytics auto-downloads the base model.
    yolo_model_path: "/home/nvidia/models/dent_yolov8.pt"
    yolo_conf: 0.4
    # Class IDs that correspond to "dent" in your model's classes.
    # Leave empty ([]) to treat every detected class as a dent.
    yolo_class_ids: []

    # ── Depth filtering for dent patch backprojection ─────────────────────────
    dent_min_depth: 0.10   # metres — ignore pixels closer than this
    dent_max_depth: 3.50   # metres — ignore pixels farther than this

    # ── Image paths (bag / offline mode) ──────────────────────────────────────
    bag_rgb_paths:
      - "/home/nvidia/data_3/rgb/000003.png"
      - "/home/nvidia/data_3/rgb/000756.png"
      - "/home/nvidia/data_3/rgb/000924.png"
      - "/home/nvidia/data_3/rgb/001140.png"
      - "/home/nvidia/data_3/rgb/001250.png"
      - "/home/nvidia/data_3/rgb/001360.png"
      - "/home/nvidia/data_3/rgb/001520.png"
      - "/home/nvidia/data_3/rgb/001680.png"
      - "/home/nvidia/data_3/rgb/001704.png"
      - "/home/nvidia/data_3/rgb/001850.png"

    bag_depth_paths:
      - "/home/nvidia/data_3/depth/000003.png"
      - "/home/nvidia/data_3/depth/000756.png"
      - "/home/nvidia/data_3/depth/000924.png"
      - "/home/nvidia/data_3/depth/001140.png"
      - "/home/nvidia/data_3/depth/001250.png"
      - "/home/nvidia/data_3/depth/001360.png"
      - "/home/nvidia/data_3/depth/001520.png"
      - "/home/nvidia/data_3/depth/001680.png"
      - "/home/nvidia/data_3/depth/001704.png"
      - "/home/nvidia/data_3/depth/001850.png"

    # ── D415 intrinsics ────────────────────────────────────────────────────────
    fx: 593.698
    fy: 592.763
    cx: 318.613
    cy: 234.720

    # ── General ───────────────────────────────────────────────────────────────
    voxel_size:   0.01
    queue_size:   5
    map_frame:    "map"
    camera_frame: "camera_color_optical_frame"
